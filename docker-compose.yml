# التشغيل:  cp .env.example .env   (عدّل الدومين وكلمات المرور)   ثم   docker compose up -d --build
# الواجهة على https://$ERP_DOMAIN (Caddy بيجيب شهادة HTTPS تلقائيًا). للشبكة المحلية بدون دومين: ERP_DOMAIN=:80
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?اكتب POSTGRES_PASSWORD في .env}
      POSTGRES_DB: erp
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U erp"], interval: 5s, retries: 10}
  app:
    build: .
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    environment:
      ERP_DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD}@db:5432/erp
      ERP_ADMIN_PASSWORD: ${ERP_ADMIN_PASSWORD:-}
    volumes: [erpdata:/data]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment: {ERP_DOMAIN: "${ERP_DOMAIN:-:80}"}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
volumes: {pgdata: {}, erpdata: {}, caddy_data: {}}
