name: ios-check
# يتأكد إن غلاف iOS بيتبني على Mac (محاكي، من غير توقيع). النشر على App Store بيتم من Xcode على Mac بحسابك (راجع README_MOBILE_AR.md).
on:
  workflow_dispatch:
    inputs:
      server_url: {description: "رابط السيرفر (https://...)", required: false}
jobs:
  ios:
    runs-on: macos-latest
    env:
      SERVER_URL: ${{ inputs.server_url || vars.ERP_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          [[ "$SERVER_URL" == https://* ]] || { echo "::error::حدّد server_url بـ https://"; exit 1; }
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pillow
      - working-directory: mobile_app
        run: |
          python ../tools/make_mobile_icons.py resources
          npm install
          node configure.js "$SERVER_URL" ashour com.ashour.erp
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#124F40' --splashBackgroundColor '#124F40' || true
          npx cap sync ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
